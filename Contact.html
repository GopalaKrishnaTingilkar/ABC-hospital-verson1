            <h1 align="center">Contact Us</h1>
        </p>
        <p>
        <h4 align="center"> If you have any questions.feel free to reach out to us.</h4>
        </p>
        <FOrm name="CONTACT" method="post"> 
         <table align="center" cellpadding="10px">
            <tr>
                <td><label for="name">
                    <b>name: </b>
                </label>
            <br><br>
            <input type="text" name="name" id="name" size="60" placeholder="your name" required>
            </td>
            </tr>
            <tr>
                <td>
                    <label for="mail">
                    <b>email: </b>    
                    </label>
                    <br><br>
                    <input type="email" name="mail" id="mail" size="60" placeholder="your email" required>
                </td>
            </tr>
            <tr>
                <td><label for="message"><b>message: </b> </label>
                <br><br>
                <textarea name="message" id="message" rows="4" cols="57s" placeholder="message"></textarea>
                </td>
            </tr>
            <tr>
                <td align="center">
                    <input class="button" id="message" type="submit" value="send message">
                </td>
            </tr>
         </table>
